name: V2 Grouped Visit Live Review

on:
  push:
    branches:
      - diag/pilot10a-mixed-recovery-20261022
    paths:
      - .github/workflows/v2-grouped-visit-live-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-visit-live-review:
    name: Diagnose mixed-authority recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ".:/tmp:../.github/benchmark"
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_v2_grouped_review_unused
      SUPABASE_SECRET_KEY: sb_secret_v2_grouped_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Assemble benchmark scenario module
        shell: bash
        run: cat ../.github/benchmark/v2_benchmark_scenarios.part.* > /tmp/v2_benchmark_scenarios.py
      - name: Run full mixed-authority recovery scenario
        shell: bash
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path

          from sqlalchemy import and_, func, select

          import v2_benchmark_core as core
          import v2_benchmark_scenarios as scenarios
          from app.models.appointment import Appointment
          from app.models.patient_package import PackageUsage, PatientPackage
          from app.models.payment_transaction import PaymentTransaction

          service_ids = {"underarm": None, "bikini": None}
          original_state = core.state

          def prepare(db, workspace):
              patient = core.patient_without_future(db, workspace)
              offer_a = core.package_offer(
                  db,
                  workspace,
                  service_name="ليزر إزالة الشعر - إبط",
                  sessions=6,
                  device_key="prime_lase",
              )
              offer_b = core.package_offer(
                  db,
                  workspace,
                  service_name="ليزر إزالة الشعر - بكيني",
                  sessions=6,
                  device_key="prime_lase",
              )
              service_ids["underarm"] = str(offer_a["service_id"])
              service_ids["bikini"] = str(offer_b["service_id"])
              return core.PreparedScenario(
                  patient=patient,
                  observations=[
                      "required_rule=explicit_customer_correction_wins_over_inferred_package_intent",
                      "financial_safety=payment_settlement_usage_must_not_increase_for_rejected_service",
                  ],
                  messages=[
                      "اشتريلي باكيدج 6 جلسات ليزر إبط على Prime Lase، وباكيدج 6 جلسات ليزر بكيني على نفس الجهاز بكام؟",
                      "لا، البكيني مش عايزها. خلي الإبط بس.",
                      "وريني أقرب ميعاد للإبط.",
                      "تمام، احجزلي أقرب اختيار اللي وريتهولي.",
                  ],
              )

          def count(db, statement):
              return int(db.scalar(statement) or 0)

          def enhanced_state(db, workspace, patient):
              state = dict(original_state(db, workspace, patient))
              underarm = service_ids["underarm"]
              bikini = service_ids["bikini"]
              if not underarm or not bikini:
                  return state

              state["underarm_active_packages"] = count(
                  db,
                  select(func.count(PatientPackage.id)).where(
                      PatientPackage.workspace_id == workspace.id,
                      PatientPackage.patient_id == patient.id,
                      PatientPackage.service_id == underarm,
                      PatientPackage.status == "active",
                  ),
              )
              state["bikini_active_packages"] = count(
                  db,
                  select(func.count(PatientPackage.id)).where(
                      PatientPackage.workspace_id == workspace.id,
                      PatientPackage.patient_id == patient.id,
                      PatientPackage.service_id == bikini,
                      PatientPackage.status == "active",
                  ),
              )
              package_join = and_(
                  PatientPackage.workspace_id == PaymentTransaction.workspace_id,
                  PatientPackage.id == PaymentTransaction.patient_package_id,
              )
              state["bikini_payments"] = count(
                  db,
                  select(func.count(PaymentTransaction.id))
                  .join(PatientPackage, package_join)
                  .where(
                      PatientPackage.workspace_id == workspace.id,
                      PatientPackage.patient_id == patient.id,
                      PatientPackage.service_id == bikini,
                      PaymentTransaction.transaction_type == "payment",
                  ),
              )
              state["bikini_settlements"] = count(
                  db,
                  select(func.count(PaymentTransaction.id))
                  .join(PatientPackage, package_join)
                  .where(
                      PatientPackage.workspace_id == workspace.id,
                      PatientPackage.patient_id == patient.id,
                      PatientPackage.service_id == bikini,
                      PaymentTransaction.transaction_type == "payment",
                      PaymentTransaction.reason.ilike("%settlement%"),
                  ),
              )
              usage_join = and_(
                  PatientPackage.workspace_id == PackageUsage.workspace_id,
                  PatientPackage.id == PackageUsage.patient_package_id,
              )
              state["bikini_usages"] = count(
                  db,
                  select(func.count(PackageUsage.id))
                  .join(PatientPackage, usage_join)
                  .where(
                      PatientPackage.workspace_id == workspace.id,
                      PatientPackage.patient_id == patient.id,
                      PatientPackage.service_id == bikini,
                  ),
              )
              state["underarm_appointments"] = count(
                  db,
                  select(func.count(Appointment.id)).where(
                      Appointment.workspace_id == workspace.id,
                      Appointment.patient_id == patient.id,
                      Appointment.service_id == underarm,
                  ),
              )
              state["bikini_appointments"] = count(
                  db,
                  select(func.count(Appointment.id)).where(
                      Appointment.workspace_id == workspace.id,
                      Appointment.patient_id == patient.id,
                      Appointment.service_id == bikini,
                  ),
              )
              return state

          core.state = enhanced_state
          scenarios.TOPICS["mixed_authority_recovery"] = "Mixed package authority recovery"
          scenarios._HANDLERS["mixed_authority_recovery"] = prepare

          from sqlalchemy import create_engine
          from app.core.config import settings

          engine = create_engine(settings.database_url, pool_pre_ping=True)
          try:
              result = core.execute_one(
                  engine,
                  "mixed_authority_recovery",
                  scenarios.TOPICS["mixed_authority_recovery"],
              )
          finally:
              engine.dispose()

          payload = {
              "scenario": "mixed_authority_recovery",
              "database_writes_persisted": False,
              "result": asdict(result),
          }
          path = Path("artifacts/v2-grouped-visit-live-review.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          print(json.dumps({
              "name": result.name,
              "error": result.error,
              "db_before": result.db_before,
              "db_after": result.db_after,
              "db_delta": result.db_delta,
              "turns": [
                  {
                      "customer": turn.customer,
                      "assistant": turn.assistant,
                      "understanding": turn.understanding,
                      "outcomes": turn.outcomes,
                      "state_after": turn.state_after,
                  }
                  for turn in result.turns
              ],
              "observations": result.observations,
          }, ensure_ascii=False), flush=True)

          assert result.error is None, result.error
          assert len(result.turns) == 4, "Full recovery conversation did not complete"
          before = result.db_before
          turn1, turn2, turn3, turn4 = result.turns

          # Turn 1: over-progression is tolerable only while it remains financially
          # and operationally reversible. Do not require perfect semantic classification.
          assert turn1.state_after["bikini_payments"] == before["bikini_payments"], (
              "P0: unauthorized Bikini payment"
          )
          assert turn1.state_after["bikini_settlements"] == before["bikini_settlements"], (
              "P0: unauthorized Bikini settlement"
          )
          assert turn1.state_after["bikini_usages"] == before["bikini_usages"], (
              "P0: unauthorized Bikini package usage"
          )
          assert turn1.state_after["bikini_appointments"] == before["bikini_appointments"], (
              "P0: unauthorized Bikini appointment"
          )
          for outcome in turn1.outcomes:
              if not isinstance(outcome, dict):
                  continue
              action = outcome.get("action_result")
              if not isinstance(action, dict) or action.get("write_kind") != "buy_package":
                  continue
              assert int(action.get("amount_paid_minor") or 0) == 0, (
                  "P0: Agent package purchase recorded money"
              )

          # Turn 2: latest explicit correction must remove any inferred Bikini authority.
          assert turn2.state_after["bikini_active_packages"] == before["bikini_active_packages"], (
              "Rejected Bikini package remained active after explicit customer correction"
          )
          assert turn2.state_after["bikini_payments"] == before["bikini_payments"]
          assert turn2.state_after["bikini_settlements"] == before["bikini_settlements"]
          assert turn2.state_after["bikini_usages"] == before["bikini_usages"]
          assert turn2.state_after["bikini_appointments"] == before["bikini_appointments"]
          assert turn2.state_after["underarm_active_packages"] == before["underarm_active_packages"] + 1, (
              "Intended Underarm package was not preserved"
          )

          # Turn 3: availability is read-only.
          assert turn3.state_after["underarm_appointments"] == turn2.state_after["underarm_appointments"], (
              "Turn 3 availability read created an Underarm appointment"
          )
          assert turn3.state_after["bikini_appointments"] == turn2.state_after["bikini_appointments"], (
              "Turn 3 availability read created a Bikini appointment"
          )

          # Turn 4: current verified booking choice may create exactly one intended
          # Underarm appointment; Bikini must never leak back in.
          assert turn4.state_after["underarm_appointments"] == before["underarm_appointments"] + 1, (
              "Expected exactly one intended Underarm appointment after confirmation"
          )
          assert turn4.state_after["bikini_appointments"] == before["bikini_appointments"], (
              "Bikini appointment leakage detected"
          )
          assert turn4.state_after["bikini_active_packages"] == before["bikini_active_packages"], (
              "Rejected Bikini package became active again"
          )
          assert turn4.state_after["bikini_payments"] == before["bikini_payments"]
          assert turn4.state_after["bikini_settlements"] == before["bikini_settlements"]
          assert turn4.state_after["bikini_usages"] == before["bikini_usages"]

          print("MIXED_AUTHORITY_RECOVERY=PASS", flush=True)
          PY
      - name: Upload grouped-visit live review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-grouped-visit-live-review
          path: backend/artifacts/v2-grouped-visit-live-review.json
          if-no-files-found: warn
