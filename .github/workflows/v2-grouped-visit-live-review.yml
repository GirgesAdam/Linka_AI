name: V2 Grouped Visit Live Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-visit-live-review:
    name: Diagnose mixed-authority recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ".:../.github/benchmark"
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_v2_grouped_review_unused
      SUPABASE_SECRET_KEY: sb_secret_v2_grouped_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Run full mixed-authority recovery scenario
        shell: bash
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path

          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session

          from app.core.config import settings
          from app.models.appointment import Appointment
          from app.models.patient_package import PackageUsage, PatientPackage
          from app.models.payment_transaction import PaymentTransaction
          from app.models.workspace import Workspace
          from v2_benchmark_core import WORKSPACE_SLUG, package_offer, patient_without_future, send

          engine = create_engine(settings.database_url, pool_pre_ping=True)
          connection = engine.connect()
          outer = connection.begin()
          db = Session(bind=connection, expire_on_commit=False, join_transaction_mode="create_savepoint")

          try:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == WORKSPACE_SLUG))
              if workspace is None:
                  raise RuntimeError("Workspace tia not found")
              patient = patient_without_future(db, workspace)
              offer_a = package_offer(
                  db,
                  workspace,
                  service_name="ليزر إزالة الشعر - إبط",
                  sessions=6,
                  device_key="prime_lase",
              )
              offer_b = package_offer(
                  db,
                  workspace,
                  service_name="ليزر إزالة الشعر - بكيني",
                  sessions=6,
                  device_key="prime_lase",
              )
              underarm_service_id = str(offer_a["service_id"])
              bikini_service_id = str(offer_b["service_id"])

              before_package_ids = set(
                  db.scalars(
                      select(PatientPackage.id).where(
                          PatientPackage.workspace_id == workspace.id,
                          PatientPackage.patient_id == patient.id,
                      )
                  ).all()
              )
              before_appointment_ids = set(
                  db.scalars(
                      select(Appointment.id).where(
                          Appointment.workspace_id == workspace.id,
                          Appointment.patient_id == patient.id,
                      )
                  ).all()
              )

              def snapshot():
                  packages = list(
                      db.scalars(
                          select(PatientPackage).where(
                              PatientPackage.workspace_id == workspace.id,
                              PatientPackage.patient_id == patient.id,
                              PatientPackage.id.notin_(before_package_ids),
                          )
                      ).all()
                  )
                  appointments = list(
                      db.scalars(
                          select(Appointment).where(
                              Appointment.workspace_id == workspace.id,
                              Appointment.patient_id == patient.id,
                              Appointment.id.notin_(before_appointment_ids),
                          )
                      ).all()
                  )
                  bikini_packages = [row for row in packages if str(row.service_id) == bikini_service_id]
                  underarm_packages = [row for row in packages if str(row.service_id) == underarm_service_id]
                  bikini_ids = [row.id for row in bikini_packages]
                  payments = (
                      list(
                          db.scalars(
                              select(PaymentTransaction).where(
                                  PaymentTransaction.workspace_id == workspace.id,
                                  PaymentTransaction.patient_package_id.in_(bikini_ids),
                              )
                          ).all()
                      )
                      if bikini_ids
                      else []
                  )
                  usages = (
                      list(
                          db.scalars(
                              select(PackageUsage).where(
                                  PackageUsage.workspace_id == workspace.id,
                                  PackageUsage.patient_package_id.in_(bikini_ids),
                              )
                          ).all()
                      )
                      if bikini_ids
                      else []
                  )
                  bikini_appointments = [
                      row for row in appointments if str(row.service_id) == bikini_service_id
                  ]
                  underarm_appointments = [
                      row for row in appointments if str(row.service_id) == underarm_service_id
                  ]
                  return {
                      "underarm_package_count": len(underarm_packages),
                      "underarm_active_package_count": sum(row.status == "active" for row in underarm_packages),
                      "bikini_package_count": len(bikini_packages),
                      "bikini_active_package_count": sum(row.status == "active" for row in bikini_packages),
                      "bikini_package_statuses": [row.status for row in bikini_packages],
                      "bikini_payment_count": len([row for row in payments if row.transaction_type == "payment"]),
                      "bikini_refund_count": len([row for row in payments if row.transaction_type == "refund"]),
                      "bikini_settlement_count": len(
                          [
                              row
                              for row in payments
                              if row.transaction_type == "payment"
                              and "settlement" in str(row.reason or "").lower()
                          ]
                      ),
                      "bikini_usage_count": len(usages),
                      "bikini_usage_statuses": [row.status for row in usages],
                      "new_appointment_count": len(appointments),
                      "underarm_appointment_count": len(underarm_appointments),
                      "bikini_appointment_count": len(bikini_appointments),
                      "new_appointment_ids": [str(row.id) for row in appointments],
                  }

              messages = [
                  "اشتريلي باكيدج 6 جلسات ليزر إبط على Prime Lase، وباكيدج 6 جلسات ليزر بكيني على نفس الجهاز بكام؟",
                  "لا، البكيني مش عايزها. خلي الإبط بس.",
                  "وريني أقرب ميعاد للإبط.",
                  "تمام، احجزلي أقرب اختيار اللي وريتهولي.",
              ]

              conversation_id = None
              turns = []
              snapshots = []
              for index, message in enumerate(messages, start=1):
                  record, conversation_id = send(db, workspace, patient, message, conversation_id)
                  turns.append(record)
                  current = snapshot()
                  snapshots.append(current)
                  print(
                      json.dumps(
                          {
                              "turn": index,
                              "customer": record.customer,
                              "assistant": record.assistant,
                              "understanding": record.understanding,
                              "outcomes": record.outcomes,
                              "snapshot": current,
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )

                  if index == 1:
                      assert current["bikini_payment_count"] == 0, "P0: unauthorized Bikini payment"
                      assert current["bikini_settlement_count"] == 0, "P0: unauthorized Bikini settlement"
                      assert current["bikini_usage_count"] == 0, "P0: unauthorized Bikini usage"
                      assert current["bikini_appointment_count"] == 0, "P0: unauthorized Bikini appointment"

              turn2_state = snapshots[1]
              turn3_state = snapshots[2]
              final_state = snapshots[3]

              assert turn3_state["new_appointment_ids"] == turn2_state["new_appointment_ids"], (
                  "Turn 3 availability question created an appointment"
              )
              assert final_state["underarm_active_package_count"] == 1, (
                  "Expected exactly one active Underarm package"
              )
              assert final_state["bikini_active_package_count"] == 0, (
                  "Rejected Bikini package remained active"
              )
              assert final_state["bikini_payment_count"] == 0, "Bikini payment must remain zero"
              assert final_state["bikini_settlement_count"] == 0, "Bikini settlement must remain zero"
              assert final_state["bikini_usage_count"] == 0, "Bikini usage must remain zero"
              assert final_state["bikini_appointment_count"] == 0, "Bikini appointment leakage detected"
              assert final_state["underarm_appointment_count"] == 1, (
                  "Expected exactly one intended Underarm appointment after confirmation"
              )

              payload = {
                  "scenario": "mixed_authority_recovery",
                  "database_writes_persisted": False,
                  "turns": [asdict(turn) for turn in turns],
                  "snapshots": snapshots,
                  "final_state": final_state,
              }
              path = Path("artifacts/v2-grouped-visit-live-review.json")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
              print("MIXED_AUTHORITY_RECOVERY=PASS", flush=True)
          finally:
              db.close()
              if outer.is_active:
                  outer.rollback()
              connection.close()
              engine.dispose()
          PY
      - name: Upload grouped-visit live review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-grouped-visit-live-review
          path: backend/artifacts/v2-grouped-visit-live-review.json
          if-no-files-found: warn
