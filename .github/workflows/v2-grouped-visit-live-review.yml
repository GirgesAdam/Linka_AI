name: V2 Grouped Visit Live Review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2-grouped-visit-live-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-visit-live-review:
    name: Recheck realistic package and authority flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ".:/tmp:../.github/benchmark"
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_v2_grouped_review_unused
      SUPABASE_SECRET_KEY: sb_secret_v2_grouped_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Assemble benchmark scenario module
        shell: bash
        run: cat ../.github/benchmark/v2_benchmark_scenarios.part.* > /tmp/v2_benchmark_scenarios.py
      - name: Verify realistic semantic authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from langchain_core.messages import HumanMessage
          from app.agents.v2.semantic_context import build_semantic_context
          from app.agents.v2.turn_interpreter import interpret_customer_turn_v2

          catalog = {
              "services": [
                  {
                      "id": "service-underarm",
                      "name": "ليزر إبط",
                      "requires_laser_device": True,
                      "laser_devices": [{"device_key": "prime_lase", "device_name": "Prime Lase"}],
                  },
                  {
                      "id": "service-bikini",
                      "name": "ليزر بكيني",
                      "requires_laser_device": True,
                      "laser_devices": [{"device_key": "prime_lase", "device_name": "Prime Lase"}],
                  },
              ],
              "doctors": [],
              "appointments": [],
          }
          context = build_semantic_context(catalog)
          local_now = datetime(2026, 10, 21, 20, 0, tzinfo=UTC)

          def interpret(text):
              turn = interpret_customer_turn_v2(
                  history=[HumanMessage(content=text)],
                  semantic_context=context,
                  timezone_name="Africa/Cairo",
                  local_now=local_now,
              )
              print(json.dumps({
                  "customer": text,
                  "operations": [
                      {"type": op.type, "execution_intent": op.execution_intent}
                      for op in turn.operations
                  ],
              }, ensure_ascii=False), flush=True)
              return turn

          inquiry = interpret("ممكن أعرف أقرب ميعاد لليزر إبط على Prime Lase؟")
          assert any(op.type == "availability" for op in inquiry.operations)
          assert all(op.execution_intent == "informational" for op in inquiry.operations)

          direct = interpret("اشتريلي باكيدج 6 جلسات ليزر إبط على Prime Lase.")
          assert any(
              op.type == "buy_package" and op.execution_intent == "execute"
              for op in direct.operations
          )

          mixed = interpret(
              "اشتريلي باكيدج 6 جلسات ليزر إبط على Prime Lase، "
              "وباكيدج 6 جلسات ليزر بكيني على نفس الجهاز بكام؟"
          )
          assert any(op.execution_intent == "execute" for op in mixed.operations)
          assert any(op.execution_intent == "informational" for op in mixed.operations)
          PY
      - name: Run realistic grouped-package scenario
        shell: bash
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          from sqlalchemy import create_engine
          from app.core.config import settings
          from v2_benchmark_core import execute_one
          from v2_benchmark_scenarios import TOPICS

          def completed_write_kinds(turn):
              kinds = []
              for outcome in turn.outcomes:
                  if not isinstance(outcome, dict):
                      continue
                  action = outcome.get("action_result")
                  if not isinstance(action, dict):
                      continue
                  kind = action.get("write_kind")
                  if action.get("ok") is True and action.get("completed") is True and isinstance(kind, str):
                      kinds.append(kind)
              return kinds

          names = ["two_packages_same_visit"]
          engine = create_engine(settings.database_url, pool_pre_ping=True)
          results = []
          for name in names:
              print(f"running {name}", flush=True)
              result = execute_one(engine, name, TOPICS[name])
              results.append(result)
              print(json.dumps({
                  "name": result.name,
                  "error": result.error,
                  "db_delta": result.db_delta,
                  "assistant": [turn.assistant for turn in result.turns],
                  "understanding": [turn.understanding for turn in result.turns],
                  "outcomes": [turn.outcomes for turn in result.turns],
                  "state_after": [turn.state_after for turn in result.turns],
              }, ensure_ascii=False), flush=True)
          engine.dispose()

          payload = {
              "scenario_names": names,
              "database_writes_persisted": False,
              "results": [asdict(item) for item in results],
          }
          path = Path("artifacts/v2-grouped-visit-live-review.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          assert not any(item.error for item in results), [item.error for item in results]
          package_result = results[0]
          assert len(package_result.turns) >= 2
          turn1, turn2 = package_result.turns[0], package_result.turns[1]
          assert isinstance(turn1.understanding, dict)
          assert isinstance(turn2.understanding, dict)

          turn1_operations = turn1.understanding.get("operations") or []
          assert turn1_operations
          assert all(
              isinstance(op, dict) and op.get("execution_intent") == "informational"
              for op in turn1_operations
          )
          assert completed_write_kinds(turn1) == []
          assert turn1.state_after.get("patient_packages") == package_result.db_before.get("patient_packages")
          assert turn1.state_after.get("appointments") == package_result.db_before.get("appointments")
          assert turn1.state_after.get("package_usages") == package_result.db_before.get("package_usages")

          turn2_operations = turn2.understanding.get("operations") or []
          assert any(
              isinstance(op, dict) and op.get("execution_intent") == "execute"
              for op in turn2_operations
          )
          assert completed_write_kinds(turn2).count("buy_package") == 2
          assert package_result.db_delta.get("patient_packages") == 2
          PY
      - name: Upload grouped-visit live review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-grouped-visit-live-review
          path: backend/artifacts/v2-grouped-visit-live-review.json
          if-no-files-found: warn
