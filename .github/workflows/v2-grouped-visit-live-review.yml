name: V2 Grouped Visit Live Review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2-grouped-visit-live-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-visit-live-review:
    name: Recheck grouped service and package visits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ".:/tmp:../.github/benchmark"
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_v2_grouped_review_unused
      SUPABASE_SECRET_KEY: sb_secret_v2_grouped_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Assemble benchmark scenario module
        shell: bash
        run: cat ../.github/benchmark/v2_benchmark_scenarios.part.* > /tmp/v2_benchmark_scenarios.py
      - name: Report sanitized runtime DB identity
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          def parse_db(name):
              raw = os.environ.get(name, "")
              parsed = urlparse(raw)
              username = parsed.username or ""
              if username == "postgres":
                  project_ref = "NONE"
                  username_shape = "direct-postgres"
              elif username.startswith("postgres."):
                  project_ref = username.split(".", 1)[1] or "NONE"
                  username_shape = "pooler-postgres"
              else:
                  project_ref = "UNKNOWN"
                  username_shape = "other"
              try:
                  port = parsed.port
              except ValueError:
                  port = "INVALID"
              return {
                  "raw": raw,
                  "scheme": parsed.scheme or "NONE",
                  "host": parsed.hostname or "NONE",
                  "port": port if port is not None else "NONE",
                  "database": parsed.path.lstrip("/") or "NONE",
                  "project_ref": project_ref,
                  "username_shape": username_shape,
              }

          def parse_supabase_ref():
              host = urlparse(os.environ.get("SUPABASE_URL", "")).hostname or ""
              if host.endswith(".supabase.co"):
                  return host.removesuffix(".supabase.co") or "UNKNOWN"
              return "UNKNOWN"

          expected_project_ref = "ycuxjlkhnubztgqmhtom"
          database = parse_db("DATABASE_URL")
          migration = parse_db("MIGRATION_DATABASE_URL")
          supabase_ref = parse_supabase_ref()

          for label, parsed in (
              ("DATABASE_URL", database),
              ("MIGRATION_DATABASE_URL", migration),
          ):
              print(f"{label}:")
              print(f"scheme: {parsed['scheme']}")
              print(f"host: {parsed['host']}")
              print(f"port: {parsed['port']}")
              print(f"database: {parsed['database']}")
              print(f"project_ref: {parsed['project_ref']}")
              print(f"username_shape: {parsed['username_shape']}")

          print("SUPABASE_URL:")
          print(f"project_ref: {supabase_ref}")
          print("DATABASE_URL == MIGRATION_DATABASE_URL:")
          print(str(database["raw"] == migration["raw"]).lower())
          print("database project ref == expected Supabase project ref:")
          print(str(database["project_ref"] == expected_project_ref).lower())
          PY
      - name: Run focused grouped-visit scenarios
        shell: bash
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          from sqlalchemy import create_engine
          from app.core.config import settings
          from v2_benchmark_core import execute_one
          from v2_benchmark_scenarios import TOPICS

          names = ["two_services_same_visit", "two_packages_same_visit"]
          engine = create_engine(settings.database_url, pool_pre_ping=True)
          results = []
          for name in names:
              print(f"running {name}", flush=True)
              result = execute_one(engine, name, TOPICS[name])
              results.append(result)
              print(json.dumps({
                  "name": result.name,
                  "error": result.error,
                  "db_delta": result.db_delta,
                  "assistant": [turn.assistant for turn in result.turns],
                  "outcomes": [turn.outcomes for turn in result.turns],
              }, ensure_ascii=False), flush=True)
          engine.dispose()
          payload = {
              "scenario_names": names,
              "database_writes_persisted": False,
              "results": [asdict(item) for item in results],
          }
          path = Path("artifacts/v2-grouped-visit-live-review.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          if any(item.error for item in results):
              raise SystemExit(1)
          PY
      - name: Upload grouped-visit live review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-grouped-visit-live-review
          path: backend/artifacts/v2-grouped-visit-live-review.json
          if-no-files-found: warn
