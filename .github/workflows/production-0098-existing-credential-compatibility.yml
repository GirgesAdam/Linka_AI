name: Production 0098 Existing Credential Compatibility (Manual Read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-0098-credential-compatibility
  cancel-in-progress: false

jobs:
  source-guard:
    name: Verify default branch, exact source and offline tests
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatch SHA without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Main source and approved Migration 0098 blob
        run: python .github/scripts/production_migration_0098_credential_probe.py source
      - name: Run offline fail-closed unit tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_production_migration_0098_credential_probe.py' -v

  read-only-compatibility:
    name: Protected database credential check — no migration
    needs: source-guard
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.source-guard.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Checkout exact dispatch SHA without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned, minimal database client dependencies
        run: |
          python -m pip install --only-binary=:all: 'SQLAlchemy==2.0.51' 'psycopg[binary]==3.3.4'
      - name: Check existing Production credential with verified TLS and READ ONLY transaction
        shell: bash
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_MIGRATION_DB_CA_CERT: ${{ secrets.PRODUCTION_MIGRATION_DB_CA_CERT }}
        run: |
          set +x
          python .github/scripts/production_migration_0098_credential_probe.py probe
