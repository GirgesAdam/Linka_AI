name: Vault Financial PostgreSQL 17.6

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vault-pg17-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vault-postgres-17-6:
    name: Vault Financial Ledger / PostgreSQL 17.6
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_vault_disposable_password
          POSTGRES_DB: vault_0099_financial_test
        ports:
          - 127.0.0.1:55443:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vault_0099_financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      checkout_postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: package_ci_user
          POSTGRES_PASSWORD: ci_package_disposable_password
          POSTGRES_DB: package_service_ci
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U package_ci_user -d package_service_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      # All hosts, users and database names are checked by the tests themselves.
      # These are throwaway GitHub Actions service containers, NEVER shared DBs.
      PYTHONPATH: .
      VAULT_PG17_REQUIRED: "1"
      VAULT_PG17_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_vault_disposable_password@127.0.0.1:55443/vault_0099_financial_test
      VAULT_PG17_BACKEND_DATABASE_URL: postgresql+psycopg://vault_ci_backend:ci_vault_backend_password@127.0.0.1:55443/vault_0099_financial_test
      EXISTING_PACKAGE_TEST_DATABASE_URL: postgresql+psycopg://package_ci_user:ci_package_disposable_password@127.0.0.1:55432/package_service_ci
      DATABASE_URL: postgresql+psycopg://postgres:ci_vault_disposable_password@127.0.0.1:55443/vault_0099_financial_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci_vault_disposable_password@127.0.0.1:55443/vault_0099_financial_test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify isolated PostgreSQL 17 and bootstrap synthetic roles
        run: |
          set -euo pipefail
          export PGPASSWORD=ci_vault_disposable_password
          psql -h 127.0.0.1 -p 55443 -U postgres -d vault_0099_financial_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE vault_ci_backend LOGIN PASSWORD 'ci_vault_backend_password' BYPASSRLS NOSUPERUSER;
          SQL
          export PGPASSWORD=ci_package_disposable_password
          psql -h 127.0.0.1 -p 55432 -U package_ci_user -d package_service_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          cfg = (
              ("VAULT_PG17_TEST_DATABASE_URL", "postgres", 55443, "vault_0099_financial_test"),
              ("VAULT_PG17_BACKEND_DATABASE_URL", "vault_ci_backend", 55443, "vault_0099_financial_test"),
              ("EXISTING_PACKAGE_TEST_DATABASE_URL", "package_ci_user", 55432, "package_service_ci"),
          )
          for key, user, port, database in cfg:
              url = make_url(os.environ[key])
              if (url.host, url.port, url.database, url.username) != ("127.0.0.1", port, database, user):
                  raise SystemExit(f"Unsafe or missing disposable PG17 connection: {key}")
              with create_engine(url, connect_args={"connect_timeout": 5}).connect() as conn:
                  version = int(conn.scalar(text("SELECT current_setting('server_version_num')")))
                  if version // 10000 != 17:
                      raise SystemExit(f"Postgres 17 is required for {key}: {version}")
                  print(f"{key}: PostgreSQL {version}, localhost-only, disposable")
          PY

      - name: Apply all Alembic revisions through 0099 to both PostgreSQL 17 databases
        run: |
          set -euo pipefail
          test "$(python -m alembic heads)" = "0099_reception_main_vault_ledger (head)"
          python -m alembic upgrade head
          MIGRATION_DATABASE_URL="$EXISTING_PACKAGE_TEST_DATABASE_URL" python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          for env in ("VAULT_PG17_TEST_DATABASE_URL", "EXISTING_PACKAGE_TEST_DATABASE_URL"):
              engine = create_engine(os.environ[env])
              with engine.connect() as db:
                  current = db.scalar(text("SELECT version_num FROM public.alembic_version"))
                  assert current == "0099_reception_main_vault_ledger", (env, current)
                  assert db.scalar(text("SELECT to_regclass('public.vault_ledger_entries')")) is not None
                  print(f"ALEMBIC_0099_APPLIED: {env} / PostgreSQL 17.6")
              engine.dispose()
          PY

      - name: Verify backend runtime SQL grants and browser role restrictions
        run: |
          set -euo pipefail
          # Restricted service role is only for disposable CI. Production grants are a separate release gate.
          PGPASSWORD=ci_vault_disposable_password psql -h 127.0.0.1 -p 55443 -U postgres -d vault_0099_financial_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE vault_0099_financial_test TO vault_ci_backend;
          GRANT USAGE ON SCHEMA public TO vault_ci_backend;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO vault_ci_backend;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO vault_ci_backend;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO vault_ci_backend;
          DO $$
          DECLARE bad_count integer;
          BEGIN
            SELECT count(*) INTO bad_count FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public'
                AND c.relname IN ('vault_accounts','vault_transfers','vault_ledger_entries','vault_pending_payments','vault_branch_grants')
                AND NOT c.relrowsecurity;
            IF bad_count <> 0 THEN RAISE EXCEPTION 'Vault RLS was disabled'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname='vault_ci_backend'
              AND (rolsuper OR NOT rolbypassrls)
            ) THEN RAISE EXCEPTION 'Backend role test is not least-privilege service compatible'; END IF;
            IF has_table_privilege('anon','public.vault_ledger_entries','SELECT')
               OR has_table_privilege('authenticated','public.vault_ledger_entries','SELECT')
               OR has_table_privilege('anon','public.vault_accounts','INSERT')
               OR has_table_privilege('authenticated','public.vault_accounts','SELECT')
               OR has_function_privilege('anon','public.vault_try_post_payment(uuid)','EXECUTE')
               OR has_function_privilege('authenticated','public.vault_try_post_payment(uuid)','EXECUTE')
            THEN RAISE EXCEPTION 'Browser role gained financial table/function privileges'; END IF;
          END $$;
          SQL
      - name: Verify Vault PostgreSQL financial concurrency with mandatory assertions
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_vault_0099_pg17_runner.py --junitxml="$RUNNER_TEMP/vault-financial-pg17.xml"
          python tests/integration/vault_0099_ci_gate.py "$RUNNER_TEMP/vault-financial-pg17.xml" 1

      - name: Verify non-superuser Backend role financial operations
        run: |
          set -euo pipefail
          python tests/integration/vault_0099_runtime_role.py

      - name: Verify actual Checkout, Refund and Package regression under Migration 0099
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_vault_checkout_0099_pg17.py \
            tests/test_existing_package_additional_service_pg17.py \
            tests/test_appointment_checkout_completion_pg17.py \
            --junitxml="$RUNNER_TEMP/vault-checkout-pg17.xml"
          python tests/integration/vault_0099_ci_gate.py "$RUNNER_TEMP/vault-checkout-pg17.xml" 63

      - name: Verify missing DB configuration fails closed
        run: |
          set -euo pipefail
          if env -u VAULT_PG17_TEST_DATABASE_URL VAULT_PG17_REQUIRED=1 \
             python -m pytest -q tests/test_vault_0099_pg17_runner.py > "$RUNNER_TEMP/negative-vault-config.log" 2>&1; then
            echo "::error::Vault PG17 runner silently passed without a test database"
            exit 1
          fi
          grep -q 'must supply a disposable localhost test DB' "$RUNNER_TEMP/negative-vault-config.log"
          echo "VAULT_PG17_MISSING_CONFIG_FAIL_CLOSED: PASS"
