name: Diagnose Explicit Daypart Semantics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-explicit-daypart-semantics.yml
      - backend/scripts/diagnose_explicit_daypart_semantics.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
      MIGRATION_DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_diagnostic_unused
      SUPABASE_SECRET_KEY: sb_secret_diagnostic_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
      AGENT_V2_LIVE_ENABLED: "true"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify real-model secret
        run: test -n "$OPENAI_API_KEY"
      - name: Validate diagnostic tooling
        run: |
          ruff check scripts/diagnose_explicit_daypart_semantics.py
          python -m compileall -q scripts/diagnose_explicit_daypart_semantics.py
      - name: Capture pre-patch semantic stages
        run: python scripts/diagnose_explicit_daypart_semantics.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explicit-daypart-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/artifacts/explicit-daypart-diagnostic.json
          if-no-files-found: error
          retention-days: 7
