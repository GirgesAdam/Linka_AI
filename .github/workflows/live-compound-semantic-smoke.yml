name: Live Compound Semantic Smoke

on:
  push:
    branches:
      - chore/retire-legacy-n8n-whatsapp-docs
    paths:
      - .github/workflows/live-compound-semantic-smoke.yml
      - backend/app/diagnostics/compound_semantic_smoke.py
      - backend/app/agents/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Five read-only semantic conversations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_semantic_smoke_unused
      SUPABASE_SECRET_KEY: sb_secret_semantic_smoke_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Run exactly five read-only semantic cases
        run: python -m app.diagnostics.compound_semantic_smoke
