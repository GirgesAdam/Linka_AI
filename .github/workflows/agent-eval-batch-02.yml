name: Agent Eval Batch 02

on:
  workflow_dispatch:
    inputs:
      batch2_base_sha:
        description: "Frozen Agent runtime SHA to evaluate"
        required: true
        type: string
      input_price_per_million:
        description: "Current model input USD per 1M tokens"
        required: true
        type: string
      cached_input_price_per_million:
        description: "Current cached-input USD per 1M tokens"
        required: true
        type: string
      output_price_per_million:
        description: "Current output USD per 1M tokens"
        required: true
        type: string
      cache_write_multiplier:
        description: "Current explicit cache-write multiplier"
        required: true
        type: string
      pricing_source:
        description: "Source/date used to verify current provider pricing"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-eval-batch-02
  cancel-in-progress: false

jobs:
  evaluate:
    name: Demo-only Batch 2 realistic stress evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      PYTHONPATH: backend:.
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_agent_eval_unused
      SUPABASE_SECRET_KEY: sb_secret_agent_eval_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      TIA_AGENT_EVAL_CONFIRM_DEMO: "1"
      CORS_ORIGINS: ""
      BATCH2_BASE_SHA: ${{ inputs.batch2_base_sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }

      - name: Confirm frozen runtime baseline
        shell: bash
        run: |
          test "$(git merge-base HEAD "$BATCH2_BASE_SHA")" = "$BATCH2_BASE_SHA" || {
            echo "Batch 2 harness branch is not based on frozen runtime SHA $BATCH2_BASE_SHA"
            exit 1
          }
          git diff --exit-code "$BATCH2_BASE_SHA"...HEAD -- backend/app || {
            echo "Runtime code changed relative to frozen Batch 2 baseline"
            exit 1
          }

      - name: Validate Batch 2 harness
        run: |
          ruff check tools/agent_eval
          python -m compileall -q tools/agent_eval
          pytest -q tools/agent_eval/tests

      - name: Run exactly Batch 02
        run: |
          python -m tools.agent_eval.run_batch_02 \
            --workspace-slug tia \
            --git-sha "$GITHUB_SHA" \
            --batch2-base-sha "$BATCH2_BASE_SHA" \
            --output-dir backend/eval_results \
            --input-price-per-million "${{ inputs.input_price_per_million }}" \
            --cached-input-price-per-million "${{ inputs.cached_input_price_per_million }}" \
            --output-price-per-million "${{ inputs.output_price_per_million }}" \
            --cache-write-multiplier "${{ inputs.cache_write_multiplier }}" \
            --pricing-source "${{ inputs.pricing_source }}"

      - name: Upload Batch 02 raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tia-agent-eval-batch-02-${{ github.sha }}
          path: backend/eval_results/batch_02_raw_*
          if-no-files-found: warn
          retention-days: 21
