name: Temporary Cancellation Validation

on:
  push:
    branches:
      - fix/cancellation-handoff-20261011

permissions:
  contents: read

jobs:
  multi-laser-real-agent:
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_user
          POSTGRES_PASSWORD: audit_password
          POSTGRES_DB: audit_db
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U audit_user -d audit_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .:../.github/benchmark
      DATABASE_URL: postgresql+psycopg://audit_user:audit_password@localhost:5432/audit_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://audit_user:audit_password@localhost:5432/audit_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_audit_dummy
      SUPABASE_SECRET_KEY: sb_secret_audit_dummy
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: test -n "$OPENAI_API_KEY"
      - name: Bootstrap DB and realistic synthetic clinic
        run: |
          PGPASSWORD=audit_password psql -h localhost -U audit_user -d audit_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL
          alembic upgrade head
          python -m scripts.provision_workspace --name 'Linka Synthetic Audit' --slug tia --timezone Africa/Cairo
          python -m scripts.seed_realistic_aesthetic_clinic --workspace-slug tia
      - name: Multi-laser rollback-only Real Agent audit
        run: |
          python - <<'PY'
          import json
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.appointment import Appointment
          from app.models.workspace import Workspace
          import v2_benchmark_core as bench

          engine = create_engine(settings.database_url, pool_pre_ping=True)

          def snapshot(db, workspace, patient):
              rows = list(db.scalars(select(Appointment).where(
                  Appointment.workspace_id == workspace.id,
                  Appointment.patient_id == patient.id,
              ).order_by(Appointment.start_at, Appointment.id)))
              return [{
                  'id': str(row.id),
                  'status': row.status,
                  'service_id': str(row.service_id),
                  'doctor_id': str(row.doctor_id) if row.doctor_id else None,
                  'branch_id': str(row.branch_id),
                  'start_at': row.start_at.isoformat(),
                  'end_at': row.end_at.isoformat(),
                  'visit_group_id': str(row.visit_group_id) if row.visit_group_id else None,
              } for row in rows]

          conn = engine.connect(); outer = conn.begin()
          db = Session(bind=conn, expire_on_commit=False, join_transaction_mode='create_savepoint')
          try:
              ws = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              patient = bench.patient_without_future(db, ws)
              patient_id = patient.id
              before = snapshot(db, ws, patient)
              messages = [
                  'عايزة أحجز في فرع مدينة نصر ليزر إزالة الشعر - إبط وليزر إزالة الشعر - بكيني وليزر إزالة الشعر - ذراعين كاملين',
                  'يوم الثلاثاء الجاي',
                  'خليهم إبط وبكيني بس',
                  'بالمناسبة سعر ليزر إزالة الشعر - إبط كام؟',
                  'تمام نكمل الحجز',
              ]
              turns = bench.run_messages(db, ws, patient, messages)
              during = snapshot(db, ws, patient)
              payload = {
                  'patient_id': str(patient_id),
                  'before': before,
                  'turns': [{
                      'customer': t.customer,
                      'assistant': t.assistant,
                      'model': t.model,
                      'understanding': t.understanding,
                      'plan': t.plan,
                      'traces': t.traces,
                      'outcomes': t.outcomes,
                      'state_after': t.state_after,
                  } for t in turns],
                  'during': during,
              }
          finally:
              db.close()
              if outer.is_active: outer.rollback()
              conn.close()
          from app.models.patient import Patient
          with Session(engine) as verify:
              ws = verify.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              patient = verify.get(Patient, payload['patient_id'])
              persisted = snapshot(verify, ws, patient)
          payload['after_rollback'] = persisted
          payload['rollback_restored'] = persisted == payload['before']
          print('ML_AUDIT=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':')))
          print('ML_SUMMARY=' + json.dumps({
              'rollback_restored': payload['rollback_restored'],
              'models': sorted({t['model'] for t in payload['turns'] if t['model']}),
          }, ensure_ascii=False, separators=(',', ':')))
          if not payload['rollback_restored']:
              raise RuntimeError('multi-laser rollback did not restore DB')
          engine.dispose()
          PY
