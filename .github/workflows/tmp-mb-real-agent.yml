name: Temporary MB Real Agent Audit

on:
  push:
    branches:
      - fix/multiservice-branch-resolution-20261011

permissions:
  contents: read

jobs:
  real-agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "false"
      AGENT_V2_LIVE_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      TIA_AGENT_EVAL_CONFIRM_DEMO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Bootstrap roles and migrate
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END
          $$;
          SQL
          python -m alembic upgrade head
      - name: Create synthetic demo workspace
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.workspace import Workspace
          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              if workspace is None:
                  workspace = Workspace(name='Linka MB Synthetic Clinic', slug='tia', timezone='Africa/Cairo', is_active=True, is_demo=True)
                  db.add(workspace)
              else:
                  workspace.is_demo = True
                  workspace.is_active = True
              db.commit()
          PY
      - name: Seed realistic aesthetic clinic
        run: python scripts/seed_realistic_aesthetic_clinic.py --workspace-slug tia
      - name: Run rollback-only Real Agent MB1-MB10
        id: audit
        working-directory: .
        shell: bash
        run: |
          set +e
          PYTHONPATH=backend:. python tools/agent_eval/tmp_mb_branch_audit.py 2>&1 | tee mb-audit-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload MB audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb-audit-evidence-${{ github.sha }}
          path: mb-audit-output.txt
          if-no-files-found: error
      - name: Publish MB audit verdict annotations
        if: always()
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path("mb-audit-output.txt").read_text(encoding="utf-8").splitlines():
              if line.startswith("{"scenario""):
                  row = json.loads(line)
                  print(f"::notice title={row['scenario']}::{row.get('verdict')}")
              elif line.startswith("MB_AUDIT_SUMMARY="):
                  print(f"::notice title=MB Audit Summary::{line.split('=', 1)[1]}")
          PY
      - name: Fail on audit verdict
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
