name: Daily Clinic Conversation Review

on:
  workflow_dispatch:
  push:
    branches:
      - test/daily-clinic-conversation-review
    paths:
      - .github/workflows/daily-clinic-conversation-review.yml
      - backend/scripts/run_daily_clinic_conversation_review.py
      - backend/scripts/run_live_agent_ux_review.py
      - backend/app/agents/**
      - backend/app/services/agent_chat.py

permissions:
  contents: read

concurrency:
  group: daily-clinic-conversation-review
  cancel-in-progress: false

jobs:
  review:
    name: Real agent daily conversations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_daily_review_unused
      SUPABASE_SECRET_KEY: sb_secret_daily_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      CORS_ORIGINS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }

      - name: Run 25 daily clinic conversations
        run: |
          python -m scripts.run_daily_clinic_conversation_review \
            --workspace-slug tia \
            --report artifacts/daily-clinic-conversation-review.json

      - name: Upload manual-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-clinic-conversation-review
          path: backend/artifacts/daily-clinic-conversation-review.json
          if-no-files-found: warn
          retention-days: 7
