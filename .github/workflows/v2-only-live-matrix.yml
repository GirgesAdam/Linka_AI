name: V2 Only Live Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-matrix:
    name: Run V2-only live clinic matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_v2_matrix_unused
      SUPABASE_SECRET_KEY: sb_secret_v2_matrix_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Run focused V2 compound sequence review
        env:
          AGENT_V2_LIVE_ENABLED: "true"
        run: python scripts/run_v2_compound_sequence_review.py --report artifacts/v2-compound-sequence-review.json
      - name: Upload focused V2 compound sequence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-compound-sequence-review
          path: backend/artifacts/v2-compound-sequence-review.json
          if-no-files-found: warn
      - name: Validate compound DB invariants
        run: python scripts/validate_v2_compound_sequence_report.py artifacts/v2-compound-sequence-review.json
      - name: Run V2-only matrix
        run: python scripts/run_v2_only_chat.py --matrix
      - name: Run V2 knowledge smoke
        run: python scripts/run_v2_kb_smoke.py
