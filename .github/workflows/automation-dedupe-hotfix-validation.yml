name: Automation Dedupe Hotfix Validation

on:
  push:
    branches: [fix/automation-dedupe-race-20261009]

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: 'false'
      DOCS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated validation worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../automation-dedupe-validation "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ../automation-dedupe-validation/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ../automation-dedupe-validation/backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Diff check
        working-directory: ../automation-dedupe-validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD

      - name: Bootstrap compatibility roles and migrate
        working-directory: ../automation-dedupe-validation/backend
        env:
          PGPASSWORD: ci_password
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
          python -m alembic upgrade head

      - name: Original concurrency regression x20
        working-directory: ../automation-dedupe-validation/backend
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "Original concurrency iteration $i/20"
            python -m pytest -q tests/test_automation_delivery_db.py::test_concurrent_planning_keeps_single_dedupe_job
          done

      - name: Focused automation planning and delivery tests
        working-directory: ../automation-dedupe-validation/backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_automation_delivery_db.py \
            tests/test_automation_dedupe_concurrency_hotfix.py
