name: Agent Eval Batch 01

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-eval-batch-01
  cancel-in-progress: true

jobs:
  evaluate:
    name: Demo-only real agent evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      PYTHONPATH: backend:.
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_agent_eval_unused
      SUPABASE_SECRET_KEY: sb_secret_agent_eval_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      TIA_AGENT_EVAL_CONFIRM_DEMO: "1"
      CORS_ORIGINS: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
          test -n "$DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Validate evaluation harness
        run: |
          ruff check tools/agent_eval
          python -m compileall -q tools/agent_eval
          pytest -q tools/agent_eval/tests
      - name: Run exactly Batch 01
        run: |
          python -m tools.agent_eval.run_batch_01 \
            --workspace-slug tia \
            --git-sha "$GITHUB_SHA" \
            --output-dir backend/eval_results
      - name: Upload Batch 01 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tia-agent-eval-batch-01-${{ github.sha }}
          path: backend/eval_results/batch_01_*
          if-no-files-found: warn
          retention-days: 14
