name: CI
# Validates clean PostgreSQL migrations plus complete backend/frontend checks.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      billing_postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: billing_ci_user
          POSTGRES_PASSWORD: ci_billing_disposable_password
          POSTGRES_DB: billing_ci
        ports:
          - 127.0.0.1:55431:5432
        options: >-
          --health-cmd "pg_isready -U billing_ci_user -d billing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      BILLING_TEST_DATABASE_URL: postgresql+psycopg://billing_ci_user:ci_billing_disposable_password@127.0.0.1:55431/billing_ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate agent eval tooling
        working-directory: .
        env:
          PYTHONPATH: backend:.
        run: |
          ruff check tools/agent_eval
          python -m compileall -q tools/agent_eval
          pytest -q tools/agent_eval/tests
      - run: ruff check app tests alembic
      - run: python -m compileall -q app alembic tests
      - name: Run production database read-only attestation tests
        working-directory: .
        run: |
          ruff check .github/scripts/production_db_readonly_attestation.py .github/scripts/tests/test_production_db_readonly_attestation.py .github/scripts/production_migration_preflight.py .github/scripts/production_migration_credential_guard.py
          python -m compileall -q .github/scripts/production_migration_preflight.py .github/scripts/production_migration_credential_guard.py
          python -m unittest discover -s .github/scripts/tests -p "test_production_db_readonly_attestation.py" -v
      - name: Verify single Alembic head
        run: test "$(python -m alembic heads)" = "0097_member_page_permissions (head)"
      - name: Bootstrap Supabase compatibility roles
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply migrations on clean PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify 16 appointment product billing regressions on PostgreSQL 17.6
        run: |
          if [ -z "${BILLING_TEST_DATABASE_URL:-}" ]; then
            echo "::error::BILLING_TEST_DATABASE_URL is required for billing regression tests"
            exit 1
          fi
          # Local disposable billing_ci only: required by appointment GiST exclusions.
          PGPASSWORD=ci_billing_disposable_password psql -h 127.0.0.1 -p 55431 -U billing_ci_user -d billing_ci -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS btree_gist;'
          python -m pytest -q tests/test_appointment_product_double_charge_regression.py --junitxml="$RUNNER_TEMP/billing-regression.xml"
          python - <<'PY'
          import os
          from xml.etree import ElementTree

          root = ElementTree.parse(os.path.join(os.environ["RUNNER_TEMP"], "billing-regression.xml")).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          totals = {
              key: sum(int(suite.get(key, "0")) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          if totals != {"tests": 16, "failures": 0, "errors": 0, "skipped": 0}:
              raise SystemExit(f"Billing regression suite did not run all 16 cases: {totals}")
          print("BILLING_POSTGRES_17_6: 16 passed, 0 skipped")
          PY
      - name: Run backend tests
        run: python -m pytest -q
  attestation-role-postgres-17-6:
    name: Read-only attestation role on PostgreSQL 17.6
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_attestation_password
          POSTGRES_DB: attestation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attestation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATTESTATION_TEST_DATABASE_URL: postgresql://postgres:ci_attestation_password@127.0.0.1:5432/attestation_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install exact attestation dependencies
        run: |
          python -m pip install --only-binary=:all: -r .github/scripts/requirements-production-db-readonly-attestation.txt
      - name: Verify least-privilege role and denied write paths
        run: python -m unittest discover -s .github/scripts/tests -p "test_production_db_readonly_role_postgres.py" -v

  python-vulnerability-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install Python vulnerability scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend Python dependencies
        # Temporary exact exception: pytest 8.4.2 / PYSEC-2026-1845; fix requires 9.0.3 but the project pins pytest<9.
        # Remove when pytest is non-vulnerable or no longer in audited requirements; pytest is test tooling, not app runtime.
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1845
      - name: Audit production attestation dependencies
        run: pip-audit -r .github/scripts/requirements-production-db-readonly-attestation.txt
      - name: Verify exact pinned production attestation runtime
        env:
          ATTESTATION_VENV: ${{ runner.temp }}/production-attestation-venv
        run: |
          python -m venv "$ATTESTATION_VENV"
          "$ATTESTATION_VENV/bin/python" --version
          test "$("$ATTESTATION_VENV/bin/python" -c 'import platform; print(platform.python_version())')" = "3.12.9"
          "$ATTESTATION_VENV/bin/python" -m pip install --only-binary=:all: --no-deps "pip==25.3"
          "$ATTESTATION_VENV/bin/python" -m pip install --only-binary=:all: --no-deps -r .github/scripts/requirements-production-db-readonly-attestation.txt
          "$ATTESTATION_VENV/bin/python" -m pip check
          "$ATTESTATION_VENV/bin/python" -m pip freeze
          "$ATTESTATION_VENV/bin/python" -m compileall -q .github/scripts/production_db_readonly_attestation.py
          "$ATTESTATION_VENV/bin/python" -m compileall -q .github/scripts/tests/test_production_db_readonly_attestation.py
          "$ATTESTATION_VENV/bin/python" -m unittest discover -s .github/scripts/tests -p "test_production_db_readonly_attestation.py" -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      TIA_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium for Playwright browser verification
        run: npx playwright install --with-deps chromium
      - name: Verify financial UI idempotency contract
        run: npx playwright test e2e/idempotent-financial-submit.spec.ts
      - name: Verify member section route policy in Chromium
        run: npx playwright test e2e/member-section-access-browser.spec.ts
      - name: Verify historical preview timeout and section access contracts
        run: npm run test:unit
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run build
