name: Temporary Post-241 Multi-Service Real E2E Audit

on:
  push:
    branches:
      - audit/multiservice-post241-e2e

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "false"
      AGENT_V2_LIVE_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      TIA_AGENT_EVAL_CONFIRM_DEMO: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      TIA_API_URL: http://127.0.0.1:8000
      AUDIT_FRONTEND_URL: http://127.0.0.1:3000
      AUDIT_UI_EMAIL: audit.reception@linka.local
      AUDIT_UI_PASSWORD: AuditPass123!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Bootstrap database and migrations
        working-directory: backend
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END
          $$;
          SQL
          python -m alembic upgrade head

      - name: Prepare audit output
        run: |
          mkdir -p audit-output
          printf '%s\n' "$GITHUB_SHA" > audit-output/audit-branch-sha.txt
          printf '%s\n' "11fecd60c25d1d3afc2fcc6eb928fd0a8cc13ec8" > audit-output/starting-main-sha.txt

      - name: Create synthetic demo workspace
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.workspace import Workspace
          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              if workspace is None:
                  workspace = Workspace(name='Linka Post241 E2E Audit', slug='tia', timezone='Africa/Cairo', is_active=True, is_demo=True)
                  db.add(workspace)
              else:
                  workspace.is_demo = True
                  workspace.is_active = True
              db.commit()
          PY

      - name: Seed realistic synthetic aesthetic clinic
        working-directory: backend
        run: python scripts/seed_realistic_aesthetic_clinic.py --workspace-slug tia | tee ../audit-output/seed.log

      - name: Validate temporary harness syntax
        run: |
          PYTHONPATH=backend:. python -m py_compile tools/agent_eval/tmp_post241_e2e_audit.py tools/agent_eval/tmp_post241_fake_supabase_auth.py
          node --check frontend/tmp_post241_ui_review.mjs

      - name: Run rollback-only Real Agent S1-S16 audit
        id: real_agent
        working-directory: .
        shell: bash
        run: |
          set +e
          PYTHONPATH=backend:. python tools/agent_eval/tmp_post241_e2e_audit.py --mode rollback 2>&1 | tee audit-output/real-agent.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused regressions #230 #231 #233 #234 #235 #236 #239 #241 + single-service
        id: regression
        working-directory: backend
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/test_agent_explicit_time_safety.py \
            tests/test_agent_availability_reference_interpreter.py \
            tests/test_v2_reschedule_required_field_safety_db.py \
            tests/test_v2_structured_output_containment.py \
            tests/test_v2_structured_output_containment_db.py \
            tests/test_v2_side_question_continuity.py \
            tests/test_v2_correction_semantics_fix.py \
            tests/test_v2_multi_service_branch_continuation.py \
            tests/test_v2_multi_service_single_appointment.py \
            tests/test_v2_multi_service_single_appointment_db.py \
            tests/test_booking_journey_contract.py \
            2>&1 | tee ../audit-output/regression.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create UI rows through real Agent V2
        id: ui_agent
        working-directory: .
        shell: bash
        run: |
          set +e
          PYTHONPATH=backend:. python tools/agent_eval/tmp_post241_e2e_audit.py --mode ui 2>&1 | tee audit-output/ui-agent.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Start audit-only local auth stub
        id: auth
        working-directory: .
        shell: bash
        run: |
          set +e
          echo "127.0.0.1 example.supabase.co" | sudo tee -a /etc/hosts
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout audit-output/audit-key.pem -out audit-output/audit-cert.pem -days 1 \
            -subj "/CN=example.supabase.co" -addext "subjectAltName=DNS:example.supabase.co"
          sudo -E env PYTHONPATH=backend:. nohup $(which python) -m uvicorn tools.agent_eval.tmp_post241_fake_supabase_auth:app \
            --host 0.0.0.0 --port 443 \
            --ssl-keyfile audit-output/audit-key.pem --ssl-certfile audit-output/audit-cert.pem \
            > audit-output/fake-auth.log 2>&1 &
          ok=1
          for i in {1..30}; do if curl --cacert audit-output/audit-cert.pem -fsS https://example.supabase.co/health; then ok=0; break; fi; sleep 1; done
          echo "exit_code=$ok" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Start real Linka backend
        id: backend_server
        working-directory: backend
        shell: bash
        run: |
          set +e
          SSL_CERT_FILE=../audit-output/audit-cert.pem nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../audit-output/backend.log 2>&1 &
          ok=1
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8000/api/v1/health/live; then ok=0; break; fi; sleep 1; done
          echo "exit_code=$ok" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install frontend and Chromium
        id: frontend_install
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee ../audit-output/frontend-install.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then npx playwright install --with-deps chromium 2>&1 | tee -a ../audit-output/frontend-install.log; code=${PIPESTATUS[0]}; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and start real Linka frontend
        id: frontend_server
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee ../audit-output/frontend-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            NODE_EXTRA_CA_CERTS=../audit-output/audit-cert.pem nohup npm start -- -p 3000 > ../audit-output/frontend.log 2>&1 &
            code=1
            for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/login >/dev/null; then code=0; break; fi; sleep 1; done
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture website screenshots from Agent-created bookings
        id: ui_capture
        working-directory: .
        shell: bash
        run: |
          set +e
          node frontend/tmp_post241_ui_review.mjs 2>&1 | tee audit-output/ui-capture.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify and clean all synthetic audit rows
        id: cleanup
        if: always()
        working-directory: backend
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee ../audit-output/cleanup.log
          import json
          from pathlib import Path
          from sqlalchemy import create_engine, delete, func, select
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.appointment import Appointment
          from app.models.appointment_additional_service import AppointmentAdditionalService
          from app.models.patient import Patient
          from app.models.workspace import Workspace

          engine = create_engine(settings.database_url)
          output = Path('../audit-output')
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              patients = list(db.scalars(select(Patient).where(Patient.workspace_id == workspace.id, Patient.source_detail.like('post241-%'))))
              ids = [row.id for row in patients]
              appointment_ids = list(db.scalars(select(Appointment.id).where(Appointment.workspace_id == workspace.id, Appointment.patient_id.in_(ids)))) if ids else []
              before_appt = len(appointment_ids)
              before_add = int(db.scalar(select(func.count()).select_from(AppointmentAdditionalService).where(AppointmentAdditionalService.appointment_id.in_(appointment_ids))) or 0) if appointment_ids else 0
              if appointment_ids:
                  db.execute(delete(Appointment).where(Appointment.id.in_(appointment_ids)))
              db.flush()
              after_appt = int(db.scalar(select(func.count()).select_from(Appointment).where(Appointment.workspace_id == workspace.id, Appointment.patient_id.in_(ids))) or 0) if ids else 0
              after_add = int(db.scalar(select(func.count()).select_from(AppointmentAdditionalService).where(AppointmentAdditionalService.appointment_id.in_(appointment_ids))) or 0) if appointment_ids else 0
              db.commit()
              evidence = {
                  'appointments_before': before_appt,
                  'appointments_after': after_appt,
                  'additional_rows_before': before_add,
                  'additional_rows_after': after_add,
                  'external_delivery': 'NO',
              }
              output.joinpath('cleanup-evidence.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
              print('CLEANUP=' + json.dumps(evidence))
              if after_appt or after_add:
                  raise SystemExit(2)
          PY
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post241-multiservice-e2e-${{ github.sha }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 7

      - name: Final audit gate
        if: always()
        shell: bash
        run: |
          echo "real_agent=${{ steps.real_agent.outputs.exit_code }}"
          echo "regression=${{ steps.regression.outputs.exit_code }}"
          echo "ui_agent=${{ steps.ui_agent.outputs.exit_code }}"
          echo "auth=${{ steps.auth.outputs.exit_code }}"
          echo "backend_server=${{ steps.backend_server.outputs.exit_code }}"
          echo "frontend_install=${{ steps.frontend_install.outputs.exit_code }}"
          echo "frontend_server=${{ steps.frontend_server.outputs.exit_code }}"
          echo "ui_capture=${{ steps.ui_capture.outputs.exit_code }}"
          echo "cleanup=${{ steps.cleanup.outputs.exit_code }}"
          test "${{ steps.real_agent.outputs.exit_code }}" = "0"
          test "${{ steps.regression.outputs.exit_code }}" = "0"
          test "${{ steps.ui_agent.outputs.exit_code }}" = "0"
          test "${{ steps.auth.outputs.exit_code }}" = "0"
          test "${{ steps.backend_server.outputs.exit_code }}" = "0"
          test "${{ steps.frontend_install.outputs.exit_code }}" = "0"
          test "${{ steps.frontend_server.outputs.exit_code }}" = "0"
          test "${{ steps.ui_capture.outputs.exit_code }}" = "0"
          test "${{ steps.cleanup.outputs.exit_code }}" = "0"
