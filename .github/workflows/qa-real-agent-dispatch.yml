name: Trusted Agent V2 QA Dispatch

on:
  workflow_dispatch:
    inputs:
      qa_harness_sha:
        description: Exact approved QA harness commit
        required: true
        type: string
        default: dbbfdff3df4bfe51866097870f9663bf58a28ca5
      agent_under_test_sha:
        description: Exact merged Agent commit; must equal LINKA_QA_APPROVED_AGENT_SHA and be an ancestor of current main
        required: true
        type: string
      scenario_ids:
        description: Only RM04, RM06, RM20, RM29 are authorized; comma-separated subset allowed
        required: true
        type: string
        default: RM04,RM06,RM20,RM29
      confirm_live:
        description: Required explicit confirmation; protected agent-qa approval is also required
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    name: Validate approved SHAs, main ancestry, scenarios, and QA review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected_scenario_ids: ${{ steps.input-check.outputs.selected_scenario_ids }}
    steps:
      - name: Checkout trusted dispatcher code and full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: bootstrap
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Reject unapproved workflow ref, source SHAs, scenarios, or missing confirmation
        id: input-check
        env:
          WORKFLOW_REF: ${{ github.ref }}
          QA_HARNESS_SHA: ${{ inputs.qa_harness_sha }}
          AGENT_UNDER_TEST_SHA: ${{ inputs.agent_under_test_sha }}
          APPROVED_AGENT_SHA: ${{ vars.LINKA_QA_APPROVED_AGENT_SHA }}
          SCENARIO_IDS: ${{ inputs.scenario_ids }}
          CONFIRM_LIVE: ${{ inputs.confirm_live }}
        shell: bash
        run: |
          python bootstrap/.github/qa_dispatch/guard.py validate-inputs \
            --workflow-ref "$WORKFLOW_REF" \
            --mode live \
            --qa-harness-sha "$QA_HARNESS_SHA" \
            --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
            --approved-agent-sha "$APPROVED_AGENT_SHA" \
            --scenario-ids "$SCENARIO_IDS" \
            --confirm-live "$CONFIRM_LIVE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify approved Agent SHA belongs to current main history
        env:
          AGENT_UNDER_TEST_SHA: ${{ inputs.agent_under_test_sha }}
          APPROVED_AGENT_SHA: ${{ vars.LINKA_QA_APPROVED_AGENT_SHA }}
        shell: bash
        run: |
          git -C bootstrap fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python bootstrap/.github/qa_dispatch/guard.py verify-main-history \
            --repo-path bootstrap \
            --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
            --approved-agent-sha "$APPROVED_AGENT_SHA"

      - name: Fetch read-only QA harness PR and review metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qa-real-03"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/264" > "$RUNNER_TEMP/qa-real-03/qa-pr.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/264/reviews?per_page=100" > "$RUNNER_TEMP/qa-real-03/qa-reviews.json"

      - name: Require exact QA harness head and current human approval
        env:
          QA_HARNESS_SHA: ${{ inputs.qa_harness_sha }}
        shell: bash
        run: |
          python bootstrap/.github/qa_dispatch/guard.py validate-qa-pr \
            --mode live \
            --qa-harness-sha "$QA_HARNESS_SHA" \
            --qa-pr "$RUNNER_TEMP/qa-real-03/qa-pr.json" \
            --qa-reviews "$RUNNER_TEMP/qa-real-03/qa-reviews.json"

  live:
    name: Protected real-Agent run (RM04, RM06, RM20, RM29 only)
    needs: preflight
    if: ${{ github.ref == 'refs/heads/main' && needs.preflight.result == 'success' && inputs.confirm_live == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure agent-qa with required reviewers and main-only deployment branches.
    environment:
      name: agent-qa
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require verified agent-qa protection policy
        env:
          QA_ENVIRONMENT_PROTECTION_CONFIRMED: ${{ vars.LINKA_QA_ENVIRONMENT_PROTECTION_CONFIRMED }}
        shell: bash
        run: |
          if [[ "$QA_ENVIRONMENT_PROTECTION_CONFIRMED" != "true" ]]; then
            echo "::error::LIVE_REFUSED: verify agent-qa required reviewers and main-only deployment branches, then set LINKA_QA_ENVIRONMENT_PROTECTION_CONFIRMED=true."
            exit 3
          fi

      - name: Checkout trusted dispatcher code and full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: bootstrap
          persist-credentials: false

      - name: Checkout exact QA harness SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.qa_harness_sha }}
          fetch-depth: 0
          path: qa-harness
          persist-credentials: false

      - name: Checkout exact Agent-under-test SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.agent_under_test_sha }}
          fetch-depth: 0
          path: execution
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify exact clean source checkouts
        env:
          QA_HARNESS_SHA: ${{ inputs.qa_harness_sha }}
          AGENT_UNDER_TEST_SHA: ${{ inputs.agent_under_test_sha }}
          APPROVED_AGENT_SHA: ${{ vars.LINKA_QA_APPROVED_AGENT_SHA }}
        run: |
          python bootstrap/.github/qa_dispatch/guard.py verify-checkouts \
            --qa-path qa-harness \
            --agent-path execution \
            --qa-harness-sha "$QA_HARNESS_SHA" \
            --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
            --approved-agent-sha "$APPROVED_AGENT_SHA" \
            --require-clean

      - name: Overlay only QA benchmark tooling onto the Agent execution workspace
        run: |
          rm -rf execution/.github/benchmark
          mkdir -p execution/.github
          cp -R qa-harness/.github/benchmark execution/.github/benchmark

      - name: Install Agent runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r execution/backend/requirements.txt

      - name: Final SHA, current-main ancestry, selection, and QA approval recheck before secrets
        id: final-check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref }}
          QA_HARNESS_SHA: ${{ inputs.qa_harness_sha }}
          AGENT_UNDER_TEST_SHA: ${{ inputs.agent_under_test_sha }}
          APPROVED_AGENT_SHA: ${{ vars.LINKA_QA_APPROVED_AGENT_SHA }}
          SCENARIO_IDS: ${{ needs.preflight.outputs.selected_scenario_ids }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qa-real-03"
          git -C bootstrap fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          gh api "repos/${GITHUB_REPOSITORY}/pulls/264" > "$RUNNER_TEMP/qa-real-03/qa-pr.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/264/reviews?per_page=100" > "$RUNNER_TEMP/qa-real-03/qa-reviews.json"
          python bootstrap/.github/qa_dispatch/guard.py validate-inputs \
            --workflow-ref "$WORKFLOW_REF" \
            --mode live \
            --qa-harness-sha "$QA_HARNESS_SHA" \
            --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
            --approved-agent-sha "$APPROVED_AGENT_SHA" \
            --scenario-ids "$SCENARIO_IDS" \
            --confirm-live true
          python bootstrap/.github/qa_dispatch/guard.py verify-main-history \
            --repo-path bootstrap \
            --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
            --approved-agent-sha "$APPROVED_AGENT_SHA"
          python bootstrap/.github/qa_dispatch/guard.py verify-checkouts \
            --qa-path qa-harness \
            --agent-path execution \
            --qa-harness-sha "$QA_HARNESS_SHA" \
            --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
            --approved-agent-sha "$APPROVED_AGENT_SHA"
          python bootstrap/.github/qa_dispatch/guard.py validate-qa-pr \
            --mode live \
            --qa-harness-sha "$QA_HARNESS_SHA" \
            --qa-pr "$RUNNER_TEMP/qa-real-03/qa-pr.json" \
            --qa-reviews "$RUNNER_TEMP/qa-real-03/qa-reviews.json"
          printf 'verified_main_sha=%s\n' "$(git -C bootstrap rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Execute selected real Agent V2 scenarios
        id: run-agent
        working-directory: execution
        env:
          SCENARIO_IDS: ${{ needs.preflight.outputs.selected_scenario_ids }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKA_QA_DATABASE_URL: ${{ secrets.LINKA_QA_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.LINKA_QA_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.LINKA_QA_DATABASE_URL }}
          LINKA_QA_EXPECTED_DATABASE_NAME: ${{ vars.LINKA_QA_EXPECTED_DATABASE_NAME }}
          LINKA_QA_EXPECTED_DATABASE_HOST: ${{ vars.LINKA_QA_EXPECTED_DATABASE_HOST }}
          LINKA_QA_RUNTIME_MARKER: ${{ vars.LINKA_QA_RUNTIME_MARKER }}
          LINKA_QA_EXPECTED_WORKSPACE_ID: ${{ vars.LINKA_QA_EXPECTED_WORKSPACE_ID }}
          LINKA_QA_EXPECTED_WORKSPACE_SLUG: ${{ vars.LINKA_QA_EXPECTED_WORKSPACE_SLUG }}
          LINKA_QA_EXTERNAL_SIDE_EFFECTS_DISABLED: ${{ vars.LINKA_QA_EXTERNAL_SIDE_EFFECTS_DISABLED }}
          LINKA_QA_LIVE_APPROVED: "true"
          AGENT_V2_LIVE_ENABLED: "true"
          ENVIRONMENT: qa
          SUPABASE_URL: https://qa-unused.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_selected_agent_unused
          SUPABASE_SECRET_KEY: sb_secret_selected_agent_unused
          PYTHONPATH: backend:.:.github/benchmark
        shell: bash
        run: |
          set +e
          python .github/benchmark/v2_selected_agent_runner.py \
            --scenario-ids "$SCENARIO_IDS" \
            --max-scenarios 4 \
            --mode live \
            --live-approved \
            --report artifacts/rm-selected-agent-run.json
          runner_status=$?
          echo "runner_exit_code=$runner_status" >> "$GITHUB_OUTPUT"
          exit "$runner_status"

      - name: Annotate raw artifact with distinct source SHAs
        if: ${{ always() }}
        env:
          QA_HARNESS_SHA: ${{ inputs.qa_harness_sha }}
          AGENT_UNDER_TEST_SHA: ${{ inputs.agent_under_test_sha }}
          APPROVED_AGENT_SHA: ${{ vars.LINKA_QA_APPROVED_AGENT_SHA }}
          VERIFIED_MAIN_SHA: ${{ steps.final-check.outputs.verified_main_sha }}
          SCENARIO_IDS: ${{ needs.preflight.outputs.selected_scenario_ids }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ -f execution/artifacts/rm-selected-agent-run.json ]; then
            python bootstrap/.github/qa_dispatch/guard.py annotate-report \
              --report execution/artifacts/rm-selected-agent-run.json \
              --qa-harness-sha "$QA_HARNESS_SHA" \
              --agent-under-test-sha "$AGENT_UNDER_TEST_SHA" \
              --approved-agent-sha "$APPROVED_AGENT_SHA" \
              --workflow-sha "$WORKFLOW_SHA" \
              --main-sha "$VERIFIED_MAIN_SHA" \
              --scenario-ids "$SCENARIO_IDS"
          else
            echo "::warning::No selected-runner report was produced."
          fi

      - name: Upload raw Agent QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-real-03-live-${{ github.run_id }}
          path: execution/artifacts/rm-selected-agent-run.json
          if-no-files-found: warn
