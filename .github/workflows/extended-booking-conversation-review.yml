name: Extended Booking Conversation Review

on:
  workflow_dispatch:
  push:
    branches:
      - test/daily-clinic-conversation-review
    paths:
      - .github/workflows/extended-booking-conversation-review.yml
      - backend/scripts/run_extended_booking_conversation_review.py
      - backend/app/agents/capability_policy.py
      - backend/app/agents/turn_interpreter.py
      - backend/app/services/agent_chat.py
      - backend/app/services/patient_history.py
      - backend/app/services/patient_packages.py
      - backend/app/schemas/patient_history.py

permissions:
  contents: read

concurrency:
  group: extended-booking-conversation-review
  cancel-in-progress: false

jobs:
  review:
    name: Real agent extended booking conversations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_extended_review_unused
      SUPABASE_SECRET_KEY: sb_secret_extended_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$DATABASE_URL"
      - name: Run extended conversations
        run: python -m scripts.run_extended_booking_conversation_review --workspace-slug tia --report artifacts/extended-booking-conversation-review.json
      - name: Upload manual-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-booking-conversation-review
          path: backend/artifacts/extended-booking-conversation-review.json
          if-no-files-found: warn
          retention-days: 7
