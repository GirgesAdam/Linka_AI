name: Temporary Availability Device Final Audit

on:
  push:
    branches:
      - audit/availability-device-final-20261012

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: backend:.
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_audit_unused
      SUPABASE_SECRET_KEY: sb_secret_audit_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_V2_LIVE_ENABLED: "true"
      CORS_ORIGINS: ""
      PRODUCTION_PARENT: aeb4535673c167778f4d2a85f4fc3c257ba08e93
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Verify exact production parent
        run: test "$(git rev-parse HEAD^)" = "$PRODUCTION_PARENT"
      - name: Verify audit-only diff
        run: |
          test -z "$(git diff --name-only HEAD^ HEAD -- backend frontend alembic ':!backend/tests')"
          test -z "$(git diff --name-only HEAD^ HEAD -- backend/tests)"
      - name: Verify model credential
        run: test -n "$OPENAI_API_KEY"
      - name: Bootstrap isolated realistic clinic
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END $$;
          SQL
          cd backend
          python -m alembic upgrade head
          python scripts/provision_workspace.py --name "TIA Demo" --slug tia --timezone Africa/Cairo
          psql -h localhost -U ci_user -d ci_db -c "UPDATE workspaces SET is_demo=true, is_active=true WHERE slug='tia';"
          python scripts/seed_realistic_aesthetic_clinic.py --workspace-slug tia
      - name: Compile audit tooling
        run: python -m py_compile tools/agent_eval/tmp_s9_ra_base.py tools/agent_eval/tmp_s9_ra10_audit.py tools/agent_eval/tmp_availability_device_baseline.py tools/agent_eval/tmp_availability_device_final_audit.py
      - name: Run deterministic matrix and preserved regressions
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_v2_availability_device_cardinality_integrity.py
          tests/test_agent_availability_reference_interpreter.py
          tests/test_agent_explicit_time_safety.py
          tests/test_v2_side_question_continuity.py
          tests/test_v2_multi_service_single_appointment.py
          tests/test_v2_booking_time_correction_authority.py
          tests/test_v2_multiservice_state_device_integrity.py
          tests/test_v2_side_question_selection_integrity.py
          tests/test_v2_date_scope_continuation.py
      - name: Run rollback-only RA-A1/A2 and RA-D1-D6
        run: python -m tools.agent_eval.tmp_availability_device_final_audit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-device-final-audit
          path: audit-output/availability-device-final-audit.json
          if-no-files-found: warn
          retention-days: 3