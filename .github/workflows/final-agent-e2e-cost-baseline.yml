name: Final Agent E2E + Cost Baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/final-agent-e2e-cost-baseline.yml
      - backend/scripts/run_final_combined_agent_e2e_cost_audit.py
      - backend/tests/test_final_combined_agent_e2e_cost_audit_tooling.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-agent-audit:
    name: C1-C20 + relative date + provider usage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_final_audit_unused
      SUPABASE_SECRET_KEY: sb_secret_final_audit_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
      AGENT_V2_LIVE_ENABLED: "true"
      AUDIT_STARTING_MAIN: 68e15b99d36392d566c69e8849cc726f19fd65d1
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact latest-main audit base and audit-only diff
        working-directory: .
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$AUDIT_STARTING_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$AUDIT_STARTING_MAIN"
          unexpected="$(git diff --name-only "$AUDIT_STARTING_MAIN"...HEAD | grep -Ev '^(\.github/workflows/final-agent-e2e-cost-baseline\.yml|backend/scripts/run_final_combined_agent_e2e_cost_audit\.py|backend/tests/test_final_combined_agent_e2e_cost_audit_tooling\.py)$' || true)"
          test -z "$unexpected" || { echo "Unexpected production diff:"; echo "$unexpected"; exit 1; }
          echo "Exact audited main: $AUDIT_STARTING_MAIN"
          echo "Audit tooling head: $(git rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify real-model secret
        run: test -n "$OPENAI_API_KEY"
      - name: Bootstrap Supabase compatibility roles
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply clean migrations
        run: python -m alembic upgrade head
      - name: Validate audit tooling
        run: |
          ruff check scripts/run_final_combined_agent_e2e_cost_audit.py tests/test_final_combined_agent_e2e_cost_audit_tooling.py
          python -m compileall -q scripts/run_final_combined_agent_e2e_cost_audit.py tests/test_final_combined_agent_e2e_cost_audit_tooling.py
          pytest -q tests/test_final_combined_agent_e2e_cost_audit_tooling.py
          git diff --check "$AUDIT_STARTING_MAIN"...HEAD
      - name: Wait for exact-head Shared CI
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["AUDIT_HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={head}&event=pull_request&per_page=100"

          for attempt in range(60):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              runs = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if run.get("name") == "CI" and run.get("head_sha") == head
              ]
              if runs:
                  run = max(runs, key=lambda item: item.get("run_number", 0))
                  print(
                      f"Shared CI #{run.get('run_number')} status={run.get('status')} "
                      f"conclusion={run.get('conclusion')} head={head}",
                      flush=True,
                  )
                  if run.get("status") == "completed":
                      if run.get("conclusion") != "success":
                          raise SystemExit("Exact-head Shared CI did not succeed")
                      raise SystemExit(0)
              else:
                  print(f"Waiting for exact-head Shared CI on {head}", flush=True)
              time.sleep(10)

          raise SystemExit("Timed out waiting for exact-head Shared CI")
          PY
      - name: Run final combined Real Agent E2E + cost audit
        id: audit
        continue-on-error: true
        run: python scripts/run_final_combined_agent_e2e_cost_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-agent-e2e-cost-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/artifacts/final-combined-agent-e2e-cost-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce audit result
        if: always()
        shell: bash
        run: test "${{ steps.audit.outcome }}" = "success"
