name: Grouped Multi-Service Intent Live Review

on:
  pull_request:
    paths:
      - .github/workflows/grouped-multiservice-intent-live-review.yml
      - backend/scripts/run_grouped_multiservice_intent_live_review.py
      - backend/scripts/run_phase3_real_world_agent_audit.py
      - backend/app/services/agent_v2/**
      - backend/app/agents/v2/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: RA-G standalone #241
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ra_g_unused
      SUPABASE_SECRET_KEY: sb_secret_ra_g_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
      AGENT_V2_LIVE_ENABLED: "true"
      RA_G_MODE: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify real-model secret
        run: test -n "$OPENAI_API_KEY"
      - name: Bootstrap Supabase compatibility roles
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply clean migrations
        run: python -m alembic upgrade head
      - name: Run focused C7 replacement
        env:
          RA_G_SCENARIOS: RA-C7-REPLACEMENT
        run: python scripts/run_grouped_multiservice_intent_live_review.py
      - name: Run focused C7 pure addition
        env:
          RA_G_SCENARIOS: RA-C7-ADDITION
        run: python scripts/run_grouped_multiservice_intent_live_review.py
      - name: Run full grouped multi-service review
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python scripts/run_grouped_multiservice_intent_live_review.py 2>&1 | tee artifacts/ra-g-standalone.log
      - name: Run Phase 3.3 real-world agent strength audit
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python scripts/run_phase3_real_world_agent_audit.py 2>&1 | tee artifacts/phase3-real-world-agent-audit.log
      - name: Upload Phase 3.3 real-world audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-real-world-agent-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/artifacts/phase3-real-world-agent-audit.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload RA-G standalone diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-g-standalone-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/artifacts/ra-g-standalone.log
          if-no-files-found: ignore
          retention-days: 7

  batch1-compatibility:
    name: RA-G Batch-1 compatibility overlay
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ra_g_overlay_unused
      SUPABASE_SECRET_KEY: sb_secret_ra_g_overlay_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
      AGENT_V2_LIVE_ENABLED: "true"
      RA_G_MODE: batch1-overlay
      BATCH1_HEAD: bed1e53dc0130312a5eb794bd441a3a450b58cb9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build audit-only compatibility tree with exact #249 head
        working-directory: .
        shell: bash
        run: |
          git fetch origin "$BATCH1_HEAD"
          if git merge-base --is-ancestor "$BATCH1_HEAD" HEAD; then
            echo "Batch-1 head already contained in current tree: $BATCH1_HEAD"
          else
            git -c user.name='RA-G Audit' -c user.email='audit@invalid.local' merge --no-commit --no-ff "$BATCH1_HEAD"
            test "$(git rev-parse MERGE_HEAD)" = "$BATCH1_HEAD"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify real-model secret
        run: test -n "$OPENAI_API_KEY"
      - name: Bootstrap Supabase compatibility roles
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply clean migrations
        run: python -m alembic upgrade head
      - name: Run RA-G1 through RA-G5 on audit-only #241 + #249 overlay
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python scripts/run_grouped_multiservice_intent_live_review.py 2>&1 | tee artifacts/ra-g-batch1-compatibility.log
      - name: Upload RA-G Batch-1 compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-g-batch1-compatibility-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/artifacts/ra-g-batch1-compatibility.log
          if-no-files-found: ignore
          retention-days: 7
