name: Temporary Multi-Service Website E2E Audit

on:
  push:
    branches:
      - audit/multiservice-ui-e2e-20261011

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "false"
      AGENT_V2_LIVE_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      TIA_AGENT_EVAL_CONFIRM_DEMO: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      TIA_API_URL: http://127.0.0.1:8000
      AUDIT_FRONTEND_URL: http://127.0.0.1:3000
      NO_PROXY: example.supabase.co,127.0.0.1,localhost
      no_proxy: example.supabase.co,127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Bootstrap database and migrations
        working-directory: backend
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END
          $$;
          SQL
          python -m alembic upgrade head

      - name: Prepare audit output
        run: |
          mkdir -p audit-output
          echo "$GITHUB_SHA" > audit-output/audit-run-sha.txt

      - name: Create synthetic demo workspace
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.workspace import Workspace
          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              if workspace is None:
                  workspace = Workspace(name='Linka Multi-Service UI Audit', slug='tia', timezone='Africa/Cairo', is_active=True, is_demo=True)
                  db.add(workspace)
              else:
                  workspace.is_demo = True
                  workspace.is_active = True
              db.commit()
          PY

      - name: Seed realistic synthetic aesthetic clinic
        working-directory: backend
        run: python scripts/seed_realistic_aesthetic_clinic.py --workspace-slug tia

      - name: Run real Agent V2 booking scenarios A B C
        working-directory: .
        run: PYTHONPATH=backend:. python tools/agent_eval/tmp_multiservice_ui_audit.py | tee audit-output/agent-run.log

      - name: Start fake local Supabase Auth
        working-directory: .
        run: |
          mkdir -p audit-output
          echo "127.0.0.1 example.supabase.co" | sudo tee -a /etc/hosts
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout audit-output/audit-key.pem -out audit-output/audit-cert.pem -days 1 \
            -subj "/CN=example.supabase.co" -addext "subjectAltName=DNS:example.supabase.co"
          sudo -E env PYTHONPATH=backend:. nohup $(which python) -m uvicorn tools.agent_eval.tmp_fake_supabase_auth:app \
            --host 0.0.0.0 --port 443 \
            --ssl-keyfile audit-output/audit-key.pem --ssl-certfile audit-output/audit-cert.pem \
            > audit-output/fake-auth.log 2>&1 &
          for i in {1..30}; do curl --cacert audit-output/audit-cert.pem -fsS https://example.supabase.co/health && break; sleep 1; done
          curl --cacert audit-output/audit-cert.pem -fsS https://example.supabase.co/health

      - name: Start real Linka backend
        working-directory: backend
        run: |
          SSL_CERT_FILE=../audit-output/audit-cert.pem nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../audit-output/backend.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and start real Linka frontend
        working-directory: frontend
        run: |
          npm run build
          NODE_EXTRA_CA_CERTS=../audit-output/audit-cert.pem nohup npm start -- -p 3000 > ../audit-output/frontend.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/login >/dev/null

      - name: Capture real UI screenshots and visible evidence
        working-directory: .
        run: node frontend/tmp_multiservice_ui_review.mjs

      - name: Verify and clean synthetic appointments
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, delete, select
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.appointment import Appointment
          from app.models.patient import Patient
          from app.models.workspace import Workspace
          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              patients = list(db.scalars(select(Patient).where(Patient.workspace_id == workspace.id, Patient.source_detail.like('multiservice-ui-audit-%'))))
              ids = [p.id for p in patients]
              before = list(db.scalars(select(Appointment.id).where(Appointment.workspace_id == workspace.id, Appointment.patient_id.in_(ids)))) if ids else []
              if ids:
                  db.execute(delete(Appointment).where(Appointment.workspace_id == workspace.id, Appointment.patient_id.in_(ids)))
              db.commit()
              after = list(db.scalars(select(Appointment.id).where(Appointment.workspace_id == workspace.id, Appointment.patient_id.in_(ids)))) if ids else []
              print(f'CLEANUP_APPOINTMENTS_BEFORE={len(before)}')
              print(f'CLEANUP_APPOINTMENTS_AFTER={len(after)}')
              if after:
                  raise SystemExit('cleanup failed')
          PY

      - name: Upload audit evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiservice-ui-e2e-${{ github.sha }}
          path: |
            audit-output/
          if-no-files-found: error
          retention-days: 7
