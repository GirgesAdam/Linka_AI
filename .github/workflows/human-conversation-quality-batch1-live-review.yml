name: Human Conversation Quality Batch 1 Live Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/human-conversation-quality-batch1-live-review.yml
      - backend/scripts/run_human_conversation_quality_batch1_review.py
      - backend/app/agents/v2/**
      - backend/app/services/agent_v2/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-conversation-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Real Agent RA-H1 through RA-H8
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_hcq_unused
      SUPABASE_SECRET_KEY: sb_secret_hcq_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }
      - name: Run RA-H1 through RA-H8
        run: python scripts/run_human_conversation_quality_batch1_review.py
