name: PR 332 isolated release rehearsal
on:
  push:
    branches: ['rehearsal/pr332-production-shape-20261125']
    paths: ['.github/workflows/pr332-release-rehearsal.yml', '.github/rehearsals/pr332_release_rehearsal.py']
permissions:
  contents: read
jobs:
  production-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: package_ci_user
          POSTGRES_PASSWORD: ci_rehearsal_disposable_only
          POSTGRES_DB: package_service_ci
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U package_ci_user -d package_service_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://package_ci_user:ci_rehearsal_disposable_only@127.0.0.1:55432/package_service_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://package_ci_user:ci_rehearsal_disposable_only@127.0.0.1:55432/package_service_ci
      EXISTING_PACKAGE_TEST_DATABASE_URL: postgresql+psycopg://package_ci_user:ci_rehearsal_disposable_only@127.0.0.1:55432/package_service_ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '95c503b9e9789d0de283c1f12d1e3b5adb5d4d82'
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/backend/requirements.txt
      - name: Install exact candidate dependencies
        run: pip install -r candidate/backend/requirements.txt
      - name: Prepare disposable database and run exact-head targeted rehearsal
        working-directory: candidate/backend
        env:
          PYTHONPATH: .
          PGPASSWORD: ci_rehearsal_disposable_only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '95c503b9e9789d0de283c1f12d1e3b5adb5d4d82'
          psql -h 127.0.0.1 -p 55432 -U package_ci_user -d package_service_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL
          python -m alembic upgrade 0099_reception_main_vault_ledger
          cp ../../.github/rehearsals/pr332_release_rehearsal.py tests/test_pr332_release_rehearsal.py
          python -m pytest -q -s tests/test_pr332_release_rehearsal.py --junitxml="$RUNNER_TEMP/pr332-rehearsal.xml"
          python -c 'import os,xml.etree.ElementTree as E; r=E.parse(os.path.join(os.environ["RUNNER_TEMP"],"pr332-rehearsal.xml")).getroot(); s=r.find("testsuite") if r.tag=="testsuites" else r; assert all(int(s.attrib[k])==v for k,v in {"tests":1,"errors":0,"failures":0,"skipped":0}.items()); print("PR332_PRODUCTION_SHAPE_REHEARSAL_PASS")'
