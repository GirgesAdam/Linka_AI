name: Member Permissions 0097 Release Guard CI

on:
  pull_request:
    paths:
      - ".github/scripts/member_permissions_0097_release.py"
      - ".github/scripts/tests/test_member_permissions_0097_release.py"
      - ".github/scripts/requirements-0097-release.txt"
      - ".github/workflows/member-permissions-0097-release.yml"
      - ".github/workflows/member-permissions-0097-release-ci.yml"
      - "backend/alembic/**"

permissions:
  contents: read

concurrency:
  group: member-permissions-0097-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release-guard-postgresql-17:
    name: Deterministic guard and original Alembic integration (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:73bedc9eaa0121b92b9b26bb52e5141b3f6f37479c7ef913c0160455763ca80a
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout PR release code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: release
          persist-credentials: false

      - name: Checkout exact approved permissions source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: 594c920ca3655851e5c9c54f7d6fec3dc7e2d32a
          path: approved
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12.9"

      - name: Install exact release dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps "pip==25.3"
          python -m pip install --only-binary=:all: --no-deps -r release/.github/scripts/requirements-0097-release.txt
          python -m pip check

      - name: Compile release guard and tests
        run: |
          python -m compileall -q release/.github/scripts/member_permissions_0097_release.py
          python -m compileall -q release/.github/scripts/tests

      - name: Bootstrap Supabase compatibility roles on isolated PostgreSQL
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h 127.0.0.1 -U ci_user -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL

      - name: Seed exact approved source to 0096 on isolated PostgreSQL
        working-directory: approved/backend
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/postgres
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/postgres
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
          ENVIRONMENT: test
          DEBUG: "false"
          DOCS_ENABLED: "false"
        run: python -m alembic upgrade 0096_patient_customer_id

      - name: Run negative regressions and real original-Alembic PostgreSQL integration
        working-directory: release
        env:
          LINKA_ISOLATED_0097_TEST: "1"
          LINKA_ISOLATED_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/postgres
          LINKA_APPROVED_SOURCE: ${{ github.workspace }}/approved
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v
