name: Temporary MB Branch Patch

on:
  push:
    branches:
      - fix/multi-service-branch-continuation-20261011

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-service-branch-continuation-20261011
          fetch-depth: 0
      - name: Stop after production patch commit
        id: gate
        shell: bash
        run: |
          message="$(git log -1 --pretty=%B)"
          if [[ "$message" == "fix: preserve grounded branch across booking continuation"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Apply focused production patch
        if: steps.gate.outputs.skip != 'true'
        run: python backend/scripts/tmp_apply_mb_branch_patch.py
      - name: Verify patch shape
        if: steps.gate.outputs.skip != 'true'
        run: |
          git diff --check
          git status --short
      - name: Commit production and permanent tests
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/agents/v2/turn_contract.py \
            backend/app/agents/v2/semantic_context.py \
            backend/app/agents/v2/semantic_state_view.py \
            backend/app/services/agent_v2/branch_task_resolution.py \
            backend/app/services/agent_v2/state.py \
            backend/app/services/agent_v2/planner.py \
            backend/app/services/agent_v2/active_task_progress.py \
            backend/app/services/agent_v2/state_rules.py \
            backend/app/services/agent_v2/state_executor.py \
            backend/app/services/agent_v2/grouped_booking_continuity.py \
            backend/app/services/agent_v2/outcome_builder.py \
            backend/tests/test_v2_multi_service_branch_continuation.py
          git commit -m "fix: preserve grounded branch across booking continuation"
          git push origin HEAD:fix/multi-service-branch-continuation-20261011
